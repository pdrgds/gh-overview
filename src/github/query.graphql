query Overview($mine: String!, $review: String!) {
  rateLimit {
    cost
    remaining
    resetAt
  }
  mine: search(query: $mine, type: ISSUE, first: 30) {
    issueCount
    nodes {
      ... on PullRequest {
        ...Base
        headRefOid
        reviews(last: 50) {
          pageInfo { hasPreviousPage }
          nodes {
            id
            state
            submittedAt
            author { __typename login }
            commit { oid }
            comments { totalCount }
          }
        }
        reviewThreads(last: 40) {
          pageInfo { hasPreviousPage }
          nodes {
            isResolved
            firstComment: comments(first: 1) { nodes { author { login } } }
            lastComment: comments(last: 1) { nodes { author { login } } }
          }
        }
        comments(last: 50) {
          pageInfo { hasPreviousPage }
          nodes {
            id
            createdAt
            author { __typename login }
          }
        }
      }
    }
  }
  review: search(query: $review, type: ISSUE, first: 30) {
    issueCount
    nodes {
      ... on PullRequest {
        ...Base
        reviewRequests(first: 20) {
          nodes {
            requestedReviewer {
              __typename
              ... on User { login }
              ... on Team { slug }
            }
          }
        }
        reviews(last: 30) {
          nodes {
            state
            submittedAt
            author { __typename login }
          }
        }
        timelineItems(itemTypes: [REVIEW_REQUESTED_EVENT], last: 20) {
          nodes {
            ... on ReviewRequestedEvent {
              id
              actor { login }
              requestedReviewer {
                __typename
                ... on User { login }
                ... on Team { slug }
              }
            }
          }
        }
      }
    }
  }
}

fragment Base on PullRequest {
  number
  title
  url
  isDraft
  createdAt
  repository { nameWithOwner }
  author { __typename login }
}
